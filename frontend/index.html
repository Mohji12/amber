    <!-- Pre-render meta tags for crawlers (runs before React) -->
    <script>
      // Inject meta tags immediately for crawlers that don't execute JavaScript
      (function() {
        const path = window.location.pathname;
        const siteUrl = 'https://amberglobaltrade.com';
        
        // Page-specific meta tag configurations
        const metaConfig = {
          '/': {
            title: 'Amber Global Trade - Premium Agricultural Export Company | Basmati Rice, Spices & Dry Fruits',
            description: 'Premium FSSAI & APEDA certified agricultural exports from India. Certified quality, competitive pricing, global shipping. Request Quote today!',
            ogImage: siteUrl + '/assets/og-default.jpg'
          },
          '/products': {
            title: 'Premium Agricultural Products - Amber Global Trade',
            description: 'Browse our certified export-quality products. Basmati rice, organic spices, dry fruits, pulses. Get Quote today for competitive pricing!',
            ogImage: siteUrl + '/assets/og-default.jpg'
          },
          '/contact': {
            title: 'Contact Us - Amber Global Trade | Export Consultation',
            description: 'Expert export guidance and support. Free consultation, competitive quotes, fast response. Contact Us today!',
            ogImage: siteUrl + '/assets/og-default.jpg'
          },
          '/quote': {
            title: 'Get Quote - Amber Global Trade | Export Pricing',
            description: 'Get personalized pricing for your export needs. Custom pricing, MOQ options, delivery estimates. Request Quote today!',
            ogImage: siteUrl + '/assets/og-default.jpg'
          },
          '/login': {
            title: 'Login - Amber Global Trade | Export Platform',
            description: 'Sign in to your Amber Global Trade account. Track orders, manage quotes, view analytics. Sign In today!',
            ogImage: siteUrl + '/assets/og-default.jpg'
          },
          '/signup': {
            title: 'Sign Up - Amber Global Trade | Create Export Account',
            description: 'Create your free export account. Access quotes, track orders, expert support. Sign Up Free today!',
            ogImage: siteUrl + '/assets/og-default.jpg'
          },
          '/blogs': {
            title: 'Export Guides & Insights - Amber Global Trade',
            description: 'Expert insights on agricultural exports. Industry knowledge, export tips, compliance guides. Read More today!',
            ogImage: siteUrl + '/assets/og-default.jpg'
          }
        };
        
        // Get config for current path or use homepage as default
        const config = metaConfig[path] || metaConfig['/'];
        
        if (config) {
          // Update title
          document.title = config.title;
          
          // Update or create meta description
          let metaDesc = document.querySelector('meta[name="description"]');
          if (!metaDesc) {
            metaDesc = document.createElement('meta');
            metaDesc.setAttribute('name', 'description');
            document.head.appendChild(metaDesc);
          }
          metaDesc.setAttribute('content', config.description);
          
          // Update Open Graph tags
          const updateOGTag = (property, content) => {
            let tag = document.querySelector(`meta[property="${property}"]`);
            if (!tag) {
              tag = document.createElement('meta');
              tag.setAttribute('property', property);
              document.head.appendChild(tag);
            }
            tag.setAttribute('content', content);
          };
          
          updateOGTag('og:title', config.title);
          updateOGTag('og:description', config.description);
          updateOGTag('og:url', siteUrl + path);
          if (config.ogImage) {
            updateOGTag('og:image', config.ogImage);
          }
          
          // Update Twitter tags
          const updateTwitterTag = (name, content) => {
            let tag = document.querySelector(`meta[name="${name}"]`);
            if (!tag) {
              tag = document.createElement('meta');
              tag.setAttribute('name', name);
              document.head.appendChild(tag);
            }
            tag.setAttribute('content', content);
          };
          
          updateTwitterTag('twitter:title', config.title);
          updateTwitterTag('twitter:description', config.description);
          if (config.ogImage) {
            updateTwitterTag('twitter:image', config.ogImage);
          }
        }
      })();
    </script>
